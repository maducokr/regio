<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regio 濡쒓렇??/title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .back-button {
            color: white;
            font-size: 20px;
            cursor: pointer;
            position: absolute;
            left: 20px;
        }

        .logo {
            text-align: center;
            flex: 1;
            color: white;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .logo p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            background: white;
            padding: 30px 20px;
            min-height: calc(100vh - 80px);
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            margin-bottom: 15px;
        }

        .input-field:focus {
            outline: none;
            border-color: #4A90E2;
        }

        .input-field::placeholder {
            color: #999;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            background-color: #ccc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            margin-bottom: 20px;
        }

        .login-button.active {
            background-color: #4A90E2;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .checkbox.checked {
            background-color: #4A90E2;
            border-color: #4A90E2;
        }

        .checkbox.checked::after {
            content: '??;
            color: white;
            font-size: 12px;
        }

        .biometric-login {
            text-align: center;
            margin-bottom: 30px;
        }

        .fingerprint-icon {
            width: 60px;
            height: 60px;
            background-color: #4A90E2;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .recovery-links {
            text-align: center;
            margin-bottom: 30px;
        }

        .recovery-links a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
        }

        .recovery-links a:hover {
            color: #4A90E2;
        }

        .divider {
            display: inline-block;
            width: 1px;
            height: 12px;
            background-color: #ddd;
            margin: 0 5px;
        }

        .membership-prompt {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .membership-prompt::before,
        .membership-prompt::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: #ddd;
        }

        .membership-prompt::before {
            left: 0;
        }

        .membership-prompt::after {
            right: 0;
        }

        .membership-text {
            background: white;
            padding: 0 15px;
            color: #666;
            font-size: 14px;
        }

        .join-button {
            width: 100%;
            padding: 15px;
            background-color: white;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .join-button:hover {
            background-color: #f8f9fa;
            border-color: #4A90E2;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            
            .login-title {
                font-size: 22px;
            }
            
            .checkbox-group {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* 紐⑤떖 ?ㅽ???*/
        .modal {
            display: block;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            right: 20px;
            top: 15px;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .modal-content h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #4A90E2;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-content button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="back-button">??/div>
        <div class="logo">
            <h1>Regio Note</h1>
            <p>Regio</p>
        </div>
    </div>

    <div class="container">
        <h2 class="login-title">濡쒓렇??/h2>
        
        <div class="input-group">
            <input type="text" class="input-field" placeholder="?깅챸" id="username">
            <input type="password" class="input-field" placeholder="?곕쾲????二쇰?踰덊샇???? id="password">
        </div>

        <button class="login-button" id="loginBtn">濡쒓렇??/button>

        <div class="checkbox-group">
            <div class="checkbox-item">
                <div class="checkbox checked" id="saveId"></div>
                <span>?깅챸 ???/span>
            </div>
            <div class="checkbox-item">
                <div class="checkbox checked" id="autoLogin"></div>
                <span>?먮룞 濡쒓렇??/span>
            </div>
        </div>

        <div class="biometric-login">
            <div class="fingerprint-icon">?몘</div>
        </div>

        <div class="recovery-links">
            <a href="#">?깅챸 李얘린</a>
            <span class="divider"></span>
            <a href="#">鍮꾨?踰덊샇 李얘린</a>
            <span class="divider"></span>
            <a href="#">?깅줉 ?뺤씤</a>
        </div>

        <div class="membership-prompt">
            <span class="membership-text">誘몃벑濡??멸???</span>
        </div>

        <button class="join-button">?깅줉?좎껌</button>
    </div>

    <script>
        // 泥댄겕諛뺤뒪 ?좉? 湲곕뒫
        document.querySelectorAll('.checkbox').forEach(checkbox => {
            checkbox.addEventListener('click', function() {
                this.classList.toggle('checked');
            });
        });

        // 濡쒓렇??踰꾪듉 ?쒖꽦??鍮꾪솢?깊솕
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');

        function checkInputs() {
            if (usernameInput.value.trim() && passwordInput.value.trim()) {
                loginBtn.classList.add('active');
                loginBtn.style.cursor = 'pointer';
            } else {
                loginBtn.classList.remove('active');
                loginBtn.style.cursor = 'not-allowed';
            }
        }

        usernameInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);

        // 濡쒓렇??踰꾪듉 ?대┃ ?대깽??
        loginBtn.addEventListener('click', async function() {
            if (this.classList.contains('active')) {
                try {
                    const requestData = {
                        name: usernameInput.value.trim(),
                        password: passwordInput.value.trim()
                    };
                    
                    console.log('濡쒓렇???붿껌 ?곗씠??', requestData);
                    
                    // JSON 臾몄옄??寃利?
                    const jsonString = JSON.stringify(requestData);
                    console.log('?꾩넚??JSON:', jsonString);
                    
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json; charset=utf-8',
                        },
                        body: jsonString
                    });

                    console.log('?쒕쾭 ?묐떟 ?곹깭:', response.status);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('?쒕쾭 ?먮윭 ?묐떟:', errorText);
                        try {
                            const errorData = JSON.parse(errorText);
                            alert(errorData.error || '濡쒓렇?몄뿉 ?ㅽ뙣?덉뒿?덈떎.');
                        } catch (e) {
                            alert('濡쒓렇?몄뿉 ?ㅽ뙣?덉뒿?덈떎.');
                        }
                        return;
                    }
                    
                    const data = await response.json();
                    console.log('?쒕쾭 ?묐떟 ?곗씠??', data);

                    if (data.success) {
                        // ?ъ슜???뺣낫瑜??몄뀡?????
                        sessionStorage.setItem('userInfo', JSON.stringify(data.user));
                        alert('濡쒓렇???깃났!');
                        // ?쒕룞 ?낅젰 ?섏씠吏濡??대룞
                        window.location.href = 'actinput.html';
                    } else {
                        alert(data.error || '濡쒓렇?몄뿉 ?ㅽ뙣?덉뒿?덈떎.');
                    }
                } catch (error) {
                    console.error('濡쒓렇???ㅻ쪟:', error);
                    alert('濡쒓렇??以??ㅻ쪟媛 諛쒖깮?덉뒿?덈떎.');
                }
            }
        });

        // ?ㅻ줈媛湲?踰꾪듉
        document.querySelector('.back-button').addEventListener('click', function() {
            alert('?ㅻ줈媛湲?);
        });

        // 吏臾?濡쒓렇??
        document.querySelector('.fingerprint-icon').addEventListener('click', function() {
            alert('吏臾??몄떇 濡쒓렇??);
        });

        // ?뚯썝媛??踰꾪듉
        document.querySelector('.join-button').addEventListener('click', function() {
            // ?깅줉 紐⑤떖 ?쒖떆
            showRegistrationModal();
        });

        // ?깅줉 紐⑤떖 ?쒖떆 ?⑥닔
        function showRegistrationModal() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>?깅줉?좎껌</h2>
                    <form id="registrationForm">
                        <input type="text" placeholder="?깅챸" id="regName" required>
                        <input type="text" placeholder="?꾪솕踰덊샇 ??4?먮━" id="regPhoneLast4" maxlength="4" required>
                        <input type="text" placeholder="二쇰?踰덊샇 ??6?먮━" id="regResidentIdFront6" maxlength="6" required>
                        <input type="text" placeholder="?꾩껜 ?꾪솕踰덊샇 (?좏깮)" id="regPhoneFull">
                        <input type="text" placeholder="?꾩껜 二쇰?踰덊샇 (?좏깮)" id="regResidentIdFull">
                        <button type="submit">?깅줉?좎껌</button>
                    </form>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // 紐⑤떖 ?リ린
            const closeBtn = modal.querySelector('.close');
            closeBtn.onclick = function() {
                document.body.removeChild(modal);
            }
            
            // 紐⑤떖 ?몃? ?대┃ ???リ린
            modal.onclick = function(e) {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            }
            
            // ?깅줉 ???쒖텧
            const form = modal.querySelector('#registrationForm');
            form.onsubmit = async function(e) {
                e.preventDefault();
                
                const formData = {
                    name: document.getElementById('regName').value.trim(),
                    phone_last4: document.getElementById('regPhoneLast4').value.trim(),
                    resident_id_front6: document.getElementById('regResidentIdFront6').value.trim(),
                    phone_full: document.getElementById('regPhoneFull').value.trim() || null,
                    resident_id_full: document.getElementById('regResidentIdFull').value.trim() || null
                };
                
                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert('?깅줉???꾨즺?섏뿀?듬땲??');
                        document.body.removeChild(modal);
                    } else {
                        alert(data.error || '?깅줉???ㅽ뙣?덉뒿?덈떎.');
                    }
                } catch (error) {
                    console.error('?깅줉 ?ㅻ쪟:', error);
                    alert('?깅줉 以??ㅻ쪟媛 諛쒖깮?덉뒿?덈떎.');
                }
            };
        }
    </script>
</body>
</html>
