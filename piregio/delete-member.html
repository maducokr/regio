<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <title>회원 삭제 - 레지오 활동 관리</title>
    <link rel="stylesheet" href="mobile.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            box-sizing: border-box;
        }
        @media (max-width: 767.98px) {
            body { padding: 0; }
            .container {
                max-width: 100%;
                border-radius: 0;
                box-shadow: none;
                min-height: 100vh;
            }
            .content { padding: 16px 12px; }
            .header { padding: 18px 14px; }
        }

        .header {
            background: #4A90E2;
            color: #fff;
            padding: 24px 28px;
        }

        .header h1 { font-size: 1.5rem; margin-bottom: 6px; }
        .header p { font-size: 0.95rem; opacity: 0.92; }

        .content { padding: 28px; }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: #222;
        }

        .search-section {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 22px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        @media (max-width: 560px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .form-group { margin-bottom: 0; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #444;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .btn {
            background: #4A90E2;
            color: #fff;
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover { background: #3a7bc8; }
        .btn:disabled {
            background: #b0bec5;
            cursor: not-allowed;
        }

        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-danger:disabled { background: #e9a0a7; }

        .btn-secondary {
            background: #fff;
            color: #555;
            border: 1px solid #cfd8dc;
        }

        .btn-secondary:hover { background: #f5f7fa; }

        .member-list {
            list-style: none;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 18px;
            max-height: 320px;
            overflow-y: auto;
        }

        .member-list:empty { display: none; }

        .member-list li {
            padding: 14px 16px;
            border-bottom: 1px solid #edf2f7;
            cursor: pointer;
            transition: background 0.15s;
        }

        .member-list li:last-child { border-bottom: none; }
        .member-list li:hover { background: #eef5fc; }
        .member-list li.selected {
            background: #e3f0fc;
            border-left: 4px solid #4A90E2;
        }

        .member-list .name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .member-list .meta {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.45;
        }

        .selected-panel {
            background: #fff8e6;
            border: 1px solid #ffe08a;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .selected-panel h3 {
            color: #8a6d00;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .detail-item {
            background: #fff;
            border-radius: 6px;
            padding: 10px 12px;
            border-left: 3px solid #4A90E2;
        }

        .detail-label {
            font-size: 0.78rem;
            color: #777;
            font-weight: 600;
        }

        .detail-value {
            margin-top: 3px;
            color: #222;
            word-break: break-all;
        }

        .related-box {
            background: #fdecea;
            border: 1px solid #f5c2c0;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .related-box h4 {
            color: #842029;
            margin-bottom: 8px;
            font-size: 0.92rem;
        }

        .related-box ul {
            margin-left: 18px;
            color: #5c1a1f;
            font-size: 0.88rem;
        }

        .confirm-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0 4px;
            font-size: 0.92rem;
        }

        .confirm-box input { width: auto; cursor: pointer; }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.92rem;
        }

        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-info { background: #e7f1fb; color: #0c5460; border: 1px solid #b8daff; }

        .loading {
            text-align: center;
            padding: 16px;
            color: #666;
        }

        .spinner {
            border: 3px solid #eee;
            border-top: 3px solid #4A90E2;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>회원 삭제</h1>
            <p>이름·성당으로 검색한 뒤 대상자를 선택하고 삭제합니다.</p>
        </div>

        <div class="content">
            <div class="top-nav">
                <button type="button" class="btn btn-secondary" id="backBtn">돌아가기</button>
            </div>

            <div id="message"></div>

            <div class="search-section">
                <div class="section-title">1. 이름 · 성당 입력</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="searchName">이름</label>
                        <input type="text" id="searchName" placeholder="성명 (예: 최유나 또는 G1최유나1234)" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="searchChurch">성당</label>
                        <input type="text" id="searchChurch" placeholder="성당이름 (예: 명동 또는 명동성당)" autocomplete="off">
                    </div>
                </div>
                <div class="btn-row">
                    <button type="button" class="btn" id="searchBtn">검색</button>
                    <button type="button" class="btn btn-secondary" id="resetBtn">초기화</button>
                </div>
            </div>

            <div id="listSection" class="hidden">
                <div class="section-title">2. 해당자 선택 <span id="resultCount" style="font-weight:500;color:#666;"></span></div>
                <ul class="member-list" id="memberList"></ul>
            </div>

            <div id="selectedSection" class="hidden">
                <div class="section-title">3. 확인 후 삭제</div>
                <div class="selected-panel">
                    <h3>선택한 회원</h3>
                    <div class="detail-grid" id="selectedDetails"></div>
                    <div class="related-box" id="relatedBox">
                        <h4>함께 삭제될 관련 데이터</h4>
                        <ul id="relatedList"></ul>
                    </div>
                    <div class="alert alert-warning">
                        <strong>주의:</strong> 삭제하면 회원 정보와 관련 활동·배당 등 모든 데이터가 영구 삭제되며 복구할 수 없습니다.
                    </div>
                    <label class="confirm-box">
                        <input type="checkbox" id="confirmCheck">
                        <span>위 내용을 확인했으며, 선택한 회원을 삭제합니다.</span>
                    </label>
                    <div class="btn-row">
                        <button type="button" class="btn" id="confirmBtn">확인</button>
                        <button type="button" class="btn btn-danger" id="deleteBtn" disabled>삭제</button>
                    </div>
                </div>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>처리 중...</p>
            </div>
        </div>
    </div>

    <script src="app-mode.js"></script>
    <script src="webview-android.js"></script>
    <script src="admin-menu.js"></script>
    <script>
        if (!RegioAdminMenu.guardCategoryAdminPage({
            deniedMessage: '회원 삭제는 관리자(김학숭)만 이용할 수 있습니다.'
        })) {
            throw new Error('delete member admin required');
        }

        const adminUser = RegioAdminMenu.getLoggedInUser();
        let searchResults = [];
        let selectedMember = null;
        let confirmedReady = false;

        const searchNameInput = document.getElementById('searchName');
        const searchChurchInput = document.getElementById('searchChurch');
        const memberListEl = document.getElementById('memberList');
        const listSection = document.getElementById('listSection');
        const selectedSection = document.getElementById('selectedSection');
        const confirmCheck = document.getElementById('confirmCheck');
        const confirmBtn = document.getElementById('confirmBtn');
        const deleteBtn = document.getElementById('deleteBtn');

        function showMessage(message, type) {
            document.getElementById('message').innerHTML =
                `<div class="alert alert-${type}">${message}</div>`;
        }

        function clearMessage() {
            document.getElementById('message').innerHTML = '';
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        function resetSelection() {
            selectedMember = null;
            confirmedReady = false;
            confirmCheck.checked = false;
            deleteBtn.disabled = true;
            selectedSection.classList.add('hidden');
            memberListEl.querySelectorAll('li').forEach((li) => li.classList.remove('selected'));
        }

        function resetAll() {
            searchNameInput.value = '';
            searchChurchInput.value = '';
            searchResults = [];
            memberListEl.innerHTML = '';
            listSection.classList.add('hidden');
            document.getElementById('resultCount').textContent = '';
            resetSelection();
            clearMessage();
            searchNameInput.focus();
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderMemberList(members) {
            memberListEl.innerHTML = '';
            members.forEach((member) => {
                const li = document.createElement('li');
                li.dataset.id = String(member.id);
                li.innerHTML = `
                    <div class="name">${escapeHtml(member.display_name || member.name)} <span style="font-weight:500;color:#888;">(#${member.id})</span></div>
                    <div class="meta">
                        ID: ${escapeHtml(member.name)} · 성당: ${escapeHtml(member.church_name || '-')} · Pr: ${escapeHtml(member.pr_name || '-')}<br>
                        직분: ${escapeHtml(member.position || '-')} · 세례명: ${escapeHtml(member.baptism_name || '-')}
                    </div>
                `;
                li.addEventListener('click', () => selectMember(member, li));
                memberListEl.appendChild(li);
            });
            listSection.classList.remove('hidden');
            document.getElementById('resultCount').textContent = `(${members.length}명)`;
        }

        async function selectMember(member, listItem) {
            selectedMember = member;
            confirmedReady = false;
            confirmCheck.checked = false;
            deleteBtn.disabled = true;

            memberListEl.querySelectorAll('li').forEach((li) => li.classList.remove('selected'));
            if (listItem) listItem.classList.add('selected');

            document.getElementById('selectedDetails').innerHTML = `
                <div class="detail-item"><div class="detail-label">회원 ID</div><div class="detail-value">${escapeHtml(member.id)}</div></div>
                <div class="detail-item"><div class="detail-label">이름</div><div class="detail-value">${escapeHtml(member.display_name || member.name)}</div></div>
                <div class="detail-item"><div class="detail-label">로그인 ID</div><div class="detail-value">${escapeHtml(member.name)}</div></div>
                <div class="detail-item"><div class="detail-label">성당</div><div class="detail-value">${escapeHtml(member.church_name || '-')}</div></div>
                <div class="detail-item"><div class="detail-label">Pr</div><div class="detail-value">${escapeHtml(member.pr_name || '-')}</div></div>
                <div class="detail-item"><div class="detail-label">직분</div><div class="detail-value">${escapeHtml(member.position || '-')}</div></div>
                <div class="detail-item"><div class="detail-label">세례명</div><div class="detail-value">${escapeHtml(member.baptism_name || '-')}</div></div>
                <div class="detail-item"><div class="detail-label">전화 끝4자리</div><div class="detail-value">${escapeHtml(member.phone_last4 || '-')}</div></div>
            `;

            selectedSection.classList.remove('hidden');
            await loadRelatedData(member.id);
        }

        async function loadRelatedData(memberId) {
            const relatedList = document.getElementById('relatedList');
            relatedList.innerHTML = '<li>조회 중...</li>';
            try {
                const response = await fetch(`/api/members/${memberId}/related-data`);
                const data = await response.json();
                if (!response.ok) {
                    relatedList.innerHTML = `<li>${escapeHtml(data.error || '조회 실패')}</li>`;
                    return;
                }
                const labels = {
                    activity_records: '활동 기록',
                    daily_activities: '일일 활동',
                    prayer_activities: '기도 활동',
                    community_activities: '지구 활동',
                    activity_inputs: '활동 입력',
                    activity_assignments: '활동 배당'
                };
                const items = Object.keys(labels)
                    .filter((key) => (data[key] || 0) > 0)
                    .map((key) => `<li>${labels[key]}: ${data[key]}건</li>`);
                relatedList.innerHTML = items.length
                    ? items.join('')
                    : '<li>관련 데이터 없음 (회원 정보만 삭제)</li>';
            } catch (error) {
                console.error(error);
                relatedList.innerHTML = '<li>관련 데이터 조회 중 오류</li>';
            }
        }

        async function searchMembers() {
            const name = searchNameInput.value.trim();
            const churchName = searchChurchInput.value.trim();
            if (!name || !churchName) {
                showMessage('이름과 성당을 모두 입력해주세요.', 'warning');
                return;
            }

            showLoading(true);
            clearMessage();
            resetSelection();

            try {
                const response = await fetch('/api/admin/members/search-for-delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=utf-8' },
                    body: JSON.stringify({
                        name,
                        church_name: churchName,
                        requester_member_id: adminUser.id
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    showMessage(data.error || '검색에 실패했습니다.', 'danger');
                    listSection.classList.add('hidden');
                    return;
                }

                searchResults = data.members || [];
                if (searchResults.length === 0) {
                    showMessage('일치하는 회원이 없습니다. 이름·성당을 확인해주세요.', 'warning');
                    listSection.classList.add('hidden');
                    memberListEl.innerHTML = '';
                    return;
                }

                showMessage(`${searchResults.length}명을 찾았습니다. 목록에서 삭제 대상자를 선택하세요.`, 'info');
                renderMemberList(searchResults);
            } catch (error) {
                console.error(error);
                showMessage('회원 검색 중 오류가 발생했습니다.', 'danger');
            } finally {
                showLoading(false);
            }
        }

        confirmBtn.addEventListener('click', () => {
            if (!selectedMember) {
                showMessage('먼저 목록에서 회원을 선택해주세요.', 'warning');
                return;
            }
            if (!confirmCheck.checked) {
                showMessage('확인 체크박스를 선택한 뒤 확인을 눌러주세요.', 'warning');
                return;
            }
            confirmedReady = true;
            deleteBtn.disabled = false;
            showMessage(
                `"${selectedMember.display_name || selectedMember.name}" (#${selectedMember.id}) 삭제가 준비되었습니다. [삭제]를 누르면 실행됩니다.`,
                'info'
            );
        });

        confirmCheck.addEventListener('change', () => {
            if (!confirmCheck.checked) {
                confirmedReady = false;
                deleteBtn.disabled = true;
            }
        });

        deleteBtn.addEventListener('click', async () => {
            if (!selectedMember || !confirmedReady || !confirmCheck.checked) {
                showMessage('확인 절차를 먼저 완료해주세요.', 'warning');
                return;
            }

            const label = selectedMember.display_name || selectedMember.name;
            if (!confirm(`정말로 "${label}" (#${selectedMember.id}) 회원과 관련 데이터를 모두 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) {
                return;
            }

            showLoading(true);
            clearMessage();

            try {
                const response = await fetch(`/api/members/${selectedMember.id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json; charset=utf-8' },
                    body: JSON.stringify({
                        requester_member_id: adminUser.id,
                        confirmed: true
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    showMessage(data.error || '회원 삭제 중 오류가 발생했습니다.', 'danger');
                    return;
                }

                const counts = data.deletedCounts || {};
                const detail = Object.keys(counts)
                    .filter((k) => counts[k] > 0)
                    .map((k) => `${k}: ${counts[k]}`)
                    .join(', ');

                showMessage(
                    `회원 "${data.deletedMember.name}"이(가) 삭제되었습니다.` +
                    (detail ? ` (관련: ${detail})` : ''),
                    'success'
                );
                searchResults = searchResults.filter((m) => m.id !== selectedMember.id);
                if (searchResults.length) {
                    renderMemberList(searchResults);
                    resetSelection();
                } else {
                    resetAll();
                    showMessage(
                        `회원 "${data.deletedMember.name}"이(가) 삭제되었습니다.` +
                        (detail ? ` (관련: ${detail})` : ''),
                        'success'
                    );
                }
            } catch (error) {
                console.error(error);
                showMessage('회원 삭제 중 오류가 발생했습니다.', 'danger');
            } finally {
                showLoading(false);
            }
        });

        document.getElementById('searchBtn').addEventListener('click', searchMembers);
        document.getElementById('resetBtn').addEventListener('click', resetAll);
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        [searchNameInput, searchChurchInput].forEach((input) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchMembers();
                }
            });
        });

        searchNameInput.focus();
    </script>
</body>
</html>
