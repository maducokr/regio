        select, input[type="text"], input[type="number"], textarea {

            padding: 12px;
            border: 1px solid #ddd;

            margin: 0 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;

                <button type="reset" class="btn btn-secondary">초기화</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('dayInputForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 폼 데이터 수집
            const formData = {
                category: document.getElementById('category').value,
                target: document.getElementById('target').value,
                count: document.getElementById('count').value,
                note: document.getElementById('note').value,
                date: new Date().toISOString().split('T')[0]
            };
            
            // 데이터 검증
            if (!formData.category || !formData.target || !formData.count) {
                alert('필수 항목을 모두 입력해주세요.');
                return;
            }
            
            // 데이터 저장 (로컬 스토리지 사용)
            let savedData = JSON.parse(localStorage.getItem('dayInputData') || '[]');
            savedData.push(formData);
            localStorage.setItem('dayInputData', JSON.stringify(savedData));
            
            // 성공 메시지
            alert('데이터가 성공적으로 저장되었습니다!');
            
            // 폼 초기화
            document.getElementById('dayInputForm').reset();
        });
        
        // 초기화 버튼 이벤트
        document.querySelector('.btn-secondary').addEventListener('click', function() {
            if (confirm('모든 입력 내용을 초기화하시겠습니까?')) {
                document.getElementById('dayInputForm').reset();
            }
        });
    </script>
