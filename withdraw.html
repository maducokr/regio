<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <title>탈단 - Regio</title>
    <link rel="stylesheet" href="mobile.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .back-button {
            color: white;
            font-size: 18px;
            cursor: pointer;
            position: absolute;
            left: 20px;
        }
        .logo { text-align: center; flex: 1; color: white; }
        .logo h1 { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
        .logo p { font-size: 12px; opacity: 0.9; }
        .container {
            background: white;
            padding: 30px 20px;
            min-height: calc(100vh - 80px);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        @media (max-width: 767.98px) {
            .container {
                max-width: 100%;
                margin: 0;
                padding: 14px 12px;
            }
        }
        .page-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #4A90E2;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            line-height: 1.6;
            color: #444;
            font-size: 12px;
        }
        .pr-box {
            background: #fff8e6;
            border: 1px solid #ffe08a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        .pr-box strong { display: block; font-size: 12px; color: #856404; margin-bottom: 8px; }
        .pr-box span { font-size: 12px; font-weight: bold; color: #333; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-danger { background: #dc3545; color: white; margin-bottom: 12px; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .loading { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <div class="back-button" onclick="goBack()">←</div>
        <div class="logo">
            <h1>Regio Note</h1>
            <p>탈단</p>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">탈단</h2>
        <div id="loadingMessage" class="loading">회원 정보를 불러오는 중...</div>

        <div id="withdrawPanel" style="display:none;">
            <div class="info-box">
                탈단 시 <strong>소속 Pr 명칭만</strong> 삭제됩니다.<br>
                직급·성당·꾸리아 등 다른 정보는 변경되지 않습니다.
            </div>
            <div class="pr-box">
                <strong>현재 소속 Pr</strong>
                <span id="currentPrName">-</span>
            </div>
            <button type="button" class="btn btn-danger" id="withdrawBtn">탈단 (Pr 명칭 삭제)</button>
            <button type="button" class="btn btn-secondary" onclick="goBack()">취소</button>
        </div>
    </div>

    <script src="app-mode.js"></script>
    <script src="webview-android.js"></script>
    <script src="admin-menu.js"></script>
    <script src="sensitive-action-auth.js"></script>
    <script>
        const withdrawAuth = RegioSensitiveAuth.guardSensitiveActionPage('withdraw', {
            message: '탈단은 Gmail 인증 후에만 진행할 수 있습니다.'
        });
        if (!withdrawAuth) {
            throw new Error('withdraw auth required');
        }

        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            const raw = sessionStorage.getItem('userInfo') || localStorage.getItem('userInfo');
            if (raw) {
                try {
                    const user = JSON.parse(raw);
                    if (RegioAdminMenu.isSampleMember(user)) {
                        alert('샘플 회원(3~103번)은 탈단을 할 수 없습니다.');
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (error) {
                    // ignore
                }
            }
            loadUserInfo();
        });

        async function loadUserInfo() {
            const raw = sessionStorage.getItem('userInfo') || localStorage.getItem('userInfo');
            if (!raw) {
                alert('로그인이 필요합니다.');
                window.location.href = 'index.html';
                return;
            }

            try {
                currentUser = JSON.parse(raw);
                if (!currentUser?.id) {
                    throw new Error('회원 ID가 없습니다.');
                }

                const response = await fetch(`/api/user/${currentUser.id}`);
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || '회원 정보를 불러올 수 없습니다.');
                }

                currentUser = { ...currentUser, ...data.user };
                const prName = (currentUser.pr_name || '').trim() || '(없음)';
                document.getElementById('currentPrName').textContent = prName;
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('withdrawPanel').style.display = 'block';

                const withdrawBtn = document.getElementById('withdrawBtn');
                if (!currentUser.pr_name || !String(currentUser.pr_name).trim()) {
                    withdrawBtn.disabled = true;
                    withdrawBtn.textContent = '삭제할 Pr 명칭이 없습니다';
                }
            } catch (error) {
                alert(error.message);
                window.location.href = 'index.html';
            }
        }

        document.getElementById('withdrawBtn').addEventListener('click', async function() {
            if (!confirm('소속 Pr 명칭만 삭제합니다. 계속하시겠습니까?')) {
                return;
            }
            this.disabled = true;
            this.textContent = '처리 중...';
            const ok = await RegioSensitiveAuth.executeWithdraw(withdrawAuth);
            if (ok) {
                window.location.href = 'index.html';
            } else {
                this.disabled = false;
                this.textContent = '탈단 (Pr 명칭 삭제)';
            }
        });

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
