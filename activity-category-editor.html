<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <title>활동종목 및 활동자료 편집 - Regio</title>
    <link rel="stylesheet" href="mobile.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .back-button {
            color: white;
            font-size: 18px;
            cursor: pointer;
            position: absolute;
            left: 20px;
        }

        .logo {
            text-align: center;
            flex: 1;
            color: white;
        }

        .logo h1 {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .logo p {
            font-size: 12px;
            opacity: 0.9;
        }

        .container {
            background: white;
            padding: 30px 20px;
            min-height: calc(100vh - 80px);
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error-message {
            color: #dc3545;
            background-color: #f8d7da;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            color: #28a745;
            background-color: #d4edda;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .category-section {
            margin-bottom: 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .category-header {
            background-color: #4A90E2;
            color: white;
            padding: 15px 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .category-header.is-daegu-senatus {
            background: linear-gradient(135deg, #16a34a, #15803d);
        }
        .category-header.is-gwangju-senatus {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }
        .activity-card.is-daegu-senatus {
            border-color: #86efac;
            background: #f0fdf4;
        }
        .activity-card.is-daegu-senatus .activity-name {
            color: #15803d;
        }
        .activity-card.is-gwangju-senatus {
            border-color: #93c5fd;
            background: #eff6ff;
        }
        .activity-card.is-gwangju-senatus .activity-name {
            color: #1d4ed8;
        }
        .daegu-senatus-legend {
            margin: 0 0 6px;
            font-size: 12px;
            color: #15803d;
            font-weight: 600;
        }
        .gwangju-senatus-legend {
            margin: 0 0 12px;
            font-size: 12px;
            color: #1d4ed8;
            font-weight: 600;
        }

        .category-content {
            padding: 20px;
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .activity-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }

        .activity-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .activity-card.editing {
            background-color: #fff3cd;
            border-color: #ffc107;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .activity-name {
            font-weight: bold;
            color: #333;
            font-size: 12px;
        }

        .activity-id {
            color: #666;
            font-size: 12px;
        }

        .activity-description {
            color: #666;
            font-size: 12px;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .activity-data {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .data-row:last-child {
            margin-bottom: 0;
        }

        .data-label {
            font-weight: 600;
            color: #333;
        }

        .data-value {
            color: #666;
        }

        .activity-records-section {
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .records-title {
            font-weight: bold;
            color: #333;
            font-size: 12px;
        }

        .records-count {
            color: #666;
            font-size: 12px;
        }

        .records-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
        }

        .record-item {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .record-item:hover {
            background-color: #f8f9fa;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-item.editing {
            background-color: #fff3cd;
        }

        .record-target {
            font-weight: bold;
            color: #333;
        }

        .record-date {
            color: #666;
            font-size: 11px;
        }

        .record-summary {
            color: #666;
            font-size: 11px;
            margin-top: 2px;
        }

        .edit-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .edit-input:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.1);
        }

        .edit-textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            min-height: 60px;
            resize: vertical;
            margin-bottom: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 2px;
        }

        .btn-primary {
            background-color: #4A90E2;
            color: white;
        }

        .btn-primary:hover {
            background-color: #357ABD;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .btn-info {
            background-color: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background-color: #138496;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .add-new-section {
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .add-new-section h3 {
            color: #495057;
            margin-bottom: 20px;
        }

        .add-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        .form-input:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.1);
        }

        .save-all-section {
            background-color: #e7f3ff;
            border: 1px solid #4A90E2;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .save-all-section h3 {
            color: #4A90E2;
            margin-bottom: 15px;
        }

        .no-records {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            .page-title {
                font-size: 12px;
            }
            
            .activity-grid {
                grid-template-columns: 1fr;
            }
            
            .add-form {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                margin: 2px 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="back-button" onclick="goBack()">←</div>
        <div class="logo">
            <h1>활동종목 및 활동자료 편집</h1>
            <p>Regio</p>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">활동종목 및 활동자료 관리</h2>
        <p class="daegu-senatus-legend">녹색 그룹/카드 = 대구 세나뚜스</p>
        <p class="gwangju-senatus-legend">파란색 카드 = 광주 세나뚜스</p>
        
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>
        
        <div id="loadingMessage" class="loading">
            활동종목과 활동자료를 불러오는 중...
        </div>

        <div id="contentContainer" style="display: none;">
            <!-- 카테고리별 섹션이 여기에 동적으로 추가됩니다 -->
        </div>

        <!-- 새 활동종목 추가 섹션 -->
        <div class="add-new-section">
            <h3>새 활동종목 추가</h3>
            <form id="addForm">
                <div class="add-form">
                    <div class="form-group">
                        <label class="form-label">활동종목명 *</label>
                        <input type="text" class="form-input" id="newCategoryName" placeholder="활동종목명을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">활동그룹 *</label>
                        <select class="form-input" id="newCategoryGroup" required>
                            <option value="">활동그룹을 선택하세요</option>
                            <option value="기도생활">기도생활</option>
                            <option value="영성생활">영성생활</option>
                            <option value="가정성화활동">가정성화활동</option>
                            <option value="지구와함께">지구와함께</option>
                            <option value="지구살리기">지구살리기</option>
                            <option value="환경보호">환경보호</option>
                            <option value="복음선교">복음선교</option>
                            <option value="이웃에 가톨릭 알리기활동">이웃에 가톨릭 알리기활동</option>
                            <option value="예비신자 돌봄">예비신자 돌봄</option>
                            <option value="예비신자와 함께하는 활동">예비신자와 함께하는 활동</option>
                            <option value="교우돌봄">교우돌봄</option>
                            <option value="이웃돌봄">이웃돌봄</option>
                            <option value="가정을 위한 활동, 교우 돌봄">가정을 위한 활동, 교우 돌봄</option>
                            <option value="성사권유 및 혼인장애자를 위한 활동">성사권유 및 혼인장애자를 위한 활동</option>
                            <option value="어려운자돌봄">어려운자돌봄</option>
                            <option value="어려움을 겪는 이웃과 나눔 활동">어려움을 겪는 이웃과 나눔 활동</option>
                            <option value="레지오활동">레지오활동</option>
                            <option value="확장">확장</option>
                            <option value="레지오의 발전을 위한 활동">레지오의 발전을 위한 활동</option>
                            <option value="소공동체와 함께하는 활동">소공동체와 함께하는 활동</option>
                            <option value="본당교회협조">본당교회협조</option>
                            <option value="본당협조활동">본당협조활동</option>
                            <option value="본당협조">본당협조</option>
                            <option value="특별활동">특별활동</option>
                            <option value="자연보호 및 생명존중 운동에 동참">자연보호 및 생명존중 운동에 동참</option>
                            <option value="상급평의회가 지시한 활동">상급평의회가 지시한 활동</option>
                            <option value="기타 활동">기타 활동</option>
                            <option value="기타">기타</option>
                            <option value="자연보호">자연보호</option>
                            <option value="기타활동">기타활동</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">설명</label>
                        <input type="text" class="form-input" id="newDescription" placeholder="설명을 입력하세요">
                    </div>
                </div>
                <button type="submit" class="btn btn-success">새 활동종목 추가</button>
            </form>
        </div>

        <!-- 전체 저장 섹션 -->
        <div class="save-all-section">
            <h3>변경사항 저장</h3>
            <p>편집한 모든 활동종목과 활동자료의 변경사항을 데이터베이스에 저장합니다.</p>
            <button class="btn btn-primary" onclick="saveAllChanges()">모든 변경사항 저장</button>
        </div>
    </div>

    <script src="webview-android.js"></script>
    <script src="daegu-senatus-categories.js?v=20260820a"></script>
    <script src="gwangju-senatus-categories.js?v=20260827q"></script>
    <script>
        let categories = [];
        let activityRecords = {};
        let editingId = null;
        let editingRecordId = null;
        let hasChanges = false;

        function isDaeguGroup(name) {
            return typeof isDaeguSenatusCategory === 'function' && isDaeguSenatusCategory(name);
        }

        function isGwangjuItem(name) {
            return typeof isGwangjuSenatusCategory === 'function' && isGwangjuSenatusCategory(name);
        }

        // 페이지 로드 시 데이터 가져오기
        window.addEventListener('DOMContentLoaded', async function() {
            await loadCategories();
        });

        // 활동종목 데이터 로드
        async function loadCategories() {
            try {
                const response = await fetch('/api/categories', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error('활동종목을 가져올 수 없습니다.');
                }

                categories = await response.json();
                console.log('로드된 활동종목:', categories);
                
                // 각 카테고리의 활동자료도 로드
                await loadAllActivityRecords();
                
                displayCategories();
                
                // 로딩 메시지 숨기고 컨텐츠 표시
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('contentContainer').style.display = 'block';
                
            } catch (error) {
                console.error('활동종목 로드 오류:', error);
                showMessage('활동종목을 불러오는 중 오류가 발생했습니다.', false);
                document.getElementById('loadingMessage').textContent = '오류가 발생했습니다. 다시 시도해주세요.';
            }
        }

        // 모든 활동자료 로드
        async function loadAllActivityRecords() {
            for (const category of categories) {
                try {
                    const response = await fetch(`/api/activity-records/${category.id}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });

                    if (response.ok) {
                        const records = await response.json();
                        activityRecords[category.id] = records;
                    } else {
                        activityRecords[category.id] = [];
                    }
                } catch (error) {
                    console.error(`활동자료 로드 오류 (카테고리 ${category.id}):`, error);
                    activityRecords[category.id] = [];
                }
            }
        }

        // 활동종목을 그룹별로 표시
        function displayCategories() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            // 그룹별로 분류
            const groupedCategories = {};
            categories.forEach(category => {
                if (!groupedCategories[category.category_group]) {
                    groupedCategories[category.category_group] = [];
                }
                groupedCategories[category.category_group].push(category);
            });

            // 각 그룹별로 섹션 생성
            Object.keys(groupedCategories).forEach(groupName => {
                const section = createCategorySection(groupName, groupedCategories[groupName]);
                container.appendChild(section);
            });
        }

        // 카테고리 섹션 생성
        function createCategorySection(groupName, groupCategories) {
            const section = document.createElement('div');
            section.className = 'category-section';
            
            const header = document.createElement('div');
            const daegu = isDaeguGroup(groupName);
            header.className = 'category-header' + (daegu ? ' is-daegu-senatus' : '');
            header.textContent = daegu ? `${groupName} · 대구 세나뚜스` : groupName;
            
            const content = document.createElement('div');
            content.className = 'category-content';
            
            const grid = document.createElement('div');
            grid.className = 'activity-grid';
            
            groupCategories.forEach(category => {
                const card = createActivityCard(category);
                grid.appendChild(card);
            });
            
            content.appendChild(grid);
            section.appendChild(header);
            section.appendChild(content);
            
            return section;
        }

        // 활동 카드 생성
        function createActivityCard(category) {
            const card = document.createElement('div');
            const gwangju = isGwangjuItem(category.category_name);
            const daegu = isDaeguGroup(category.category_name);
            card.className = 'activity-card'
                + (daegu ? ' is-daegu-senatus' : '')
                + (gwangju ? ' is-gwangju-senatus' : '');
            card.id = `card-${category.id}`;
            
            const records = activityRecords[category.id] || [];
            
            card.innerHTML = `
                <div class="activity-header">
                    <div>
                        <div class="activity-name" id="name-${category.id}">${category.category_name}</div>
                        <div class="activity-id">ID: ${category.id}</div>
                    </div>
                </div>
                <div class="activity-description" id="desc-${category.id}">${category.description || '설명 없음'}</div>
                
                <!-- 편집 모드가 아닐 때 표시 -->
                <div class="display-mode" id="display-${category.id}">
                    <div class="activity-data">
                        <div class="data-row">
                            <span class="data-label">활동종목명:</span>
                            <span class="data-value">${category.category_name}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">활동그룹:</span>
                            <span class="data-value">${category.category_group}</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">설명:</span>
                            <span class="data-value">${category.description || '설명 없음'}</span>
                        </div>
                    </div>
                    
                    <!-- 활동자료 섹션 -->
                    <div class="activity-records-section">
                        <div class="records-header">
                            <span class="records-title">활동자료</span>
                            <span class="records-count">${records.length}개</span>
                        </div>
                        <div class="records-list" id="records-list-${category.id}">
                            ${records.length > 0 ? records.map(record => `
                                <div class="record-item" onclick="viewRecord(${category.id}, ${record.id})">
                                    <div class="record-target">${record.target || '대상 없음'}</div>
                                    <div class="record-date">${new Date(record.activity_date).toLocaleDateString()}</div>
                                    <div class="record-summary">
                                        횟수: ${record.count}, 교리반인도: ${record.catechism_guide}, 
                                        단체가입: ${record.group_join}, 회두: ${record.meeting_head}
                                    </div>
                                </div>
                            `).join('') : '<div class="no-records">활동자료가 없습니다</div>'}
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-warning" onclick="startEdit(${category.id})">수정</button>
                        <button class="btn btn-info" onclick="addActivityRecord(${category.id})">활동자료 추가</button>
                    </div>
                </div>
                
                <!-- 편집 모드일 때 표시 -->
                <div class="edit-mode hidden" id="edit-${category.id}">
                    <input type="text" class="edit-input" id="edit-name-${category.id}" value="${category.category_name}" placeholder="활동종목명">
                    <select class="edit-input" id="edit-group-${category.id}">
                        <option value="기도생활" ${category.category_group === '기도생활' ? 'selected' : ''}>기도생활</option>
                        <option value="영성생활" ${category.category_group === '영성생활' ? 'selected' : ''}>영성생활</option>
                        <option value="가정성화활동" ${category.category_group === '가정성화활동' ? 'selected' : ''}>가정성화활동</option>
                        <option value="지구와함께" ${category.category_group === '지구와함께' ? 'selected' : ''}>지구와함께</option>
                        <option value="지구살리기" ${category.category_group === '지구살리기' ? 'selected' : ''}>지구살리기</option>
                        <option value="환경보호" ${category.category_group === '환경보호' ? 'selected' : ''}>환경보호</option>
                        <option value="복음선교" ${category.category_group === '복음선교' ? 'selected' : ''}>복음선교</option>
                        <option value="이웃에 가톨릭 알리기활동" ${category.category_group === '이웃에 가톨릭 알리기활동' ? 'selected' : ''}>이웃에 가톨릭 알리기활동</option>
                        <option value="예비신자 돌봄" ${category.category_group === '예비신자 돌봄' || category.category_group === '예비자 돌봄' ? 'selected' : ''}>예비신자 돌봄</option>
                        <option value="예비신자와 함께하는 활동" ${category.category_group === '예비신자와 함께하는 활동' ? 'selected' : ''}>예비신자와 함께하는 활동</option>
                        <option value="교우돌봄" ${category.category_group === '교우돌봄' ? 'selected' : ''}>교우돌봄</option>
                        <option value="이웃돌봄" ${category.category_group === '이웃돌봄' ? 'selected' : ''}>이웃돌봄</option>
                        <option value="가정을 위한 활동, 교우 돌봄" ${category.category_group === '가정을 위한 활동, 교우 돌봄' ? 'selected' : ''}>가정을 위한 활동, 교우 돌봄</option>
                        <option value="성사권유 및 혼인장애자를 위한 활동" ${category.category_group === '성사권유 및 혼인장애자를 위한 활동' ? 'selected' : ''}>성사권유 및 혼인장애자를 위한 활동</option>
                        <option value="어려운자돌봄" ${category.category_group === '어려운자돌봄' ? 'selected' : ''}>어려운자돌봄</option>
                        <option value="어려움을 겪는 이웃과 나눔 활동" ${category.category_group === '어려움을 겪는 이웃과 나눔 활동' ? 'selected' : ''}>어려움을 겪는 이웃과 나눔 활동</option>
                        <option value="레지오활동" ${category.category_group === '레지오활동' ? 'selected' : ''}>레지오활동</option>
                        <option value="확장" ${category.category_group === '확장' ? 'selected' : ''}>확장</option>
                        <option value="레지오의 발전을 위한 활동" ${category.category_group === '레지오의 발전을 위한 활동' ? 'selected' : ''}>레지오의 발전을 위한 활동</option>
                        <option value="소공동체와 함께하는 활동" ${category.category_group === '소공동체와 함께하는 활동' ? 'selected' : ''}>소공동체와 함께하는 활동</option>
                        <option value="본당교회협조" ${category.category_group === '본당교회협조' ? 'selected' : ''}>본당교회협조</option>
                        <option value="본당협조활동" ${category.category_group === '본당협조활동' ? 'selected' : ''}>본당협조활동</option>
                        <option value="본당협조" ${category.category_group === '본당협조' ? 'selected' : ''}>본당협조</option>
                        <option value="특별활동" ${category.category_group === '특별활동' ? 'selected' : ''}>특별활동</option>
                        <option value="자연보호 및 생명존중 운동에 동참" ${category.category_group === '자연보호 및 생명존중 운동에 동참' ? 'selected' : ''}>자연보호 및 생명존중 운동에 동참</option>
                        <option value="상급평의회가 지시한 활동" ${category.category_group === '상급평의회가 지시한 활동' ? 'selected' : ''}>상급평의회가 지시한 활동</option>
                        <option value="기타 활동" ${category.category_group === '기타 활동' ? 'selected' : ''}>기타 활동</option>
                        <option value="기타" ${category.category_group === '기타' ? 'selected' : ''}>기타</option>
                        <option value="자연보호" ${category.category_group === '자연보호' ? 'selected' : ''}>자연보호</option>
                        <option value="기타활동" ${category.category_group === '기타활동' ? 'selected' : ''}>기타활동</option>
                    </select>
                    <textarea class="edit-textarea" id="edit-desc-${category.id}" placeholder="설명을 입력하세요">${category.description || ''}</textarea>
                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="saveEdit(${category.id})">저장</button>
                        <button class="btn btn-danger" onclick="cancelEdit(${category.id})">취소</button>
                    </div>
                </div>
            `;
            
            return card;
        }

        // 수정 모드 시작
        function startEdit(id) {
            if (editingId && editingId !== id) {
                if (confirm('다른 항목을 편집 중입니다. 계속하시겠습니까?')) {
                    cancelEdit(editingId);
                } else {
                    return;
                }
            }
            
            editingId = id;
            const card = document.getElementById(`card-${id}`);
            
            // 카드를 편집 모드로 변경
            card.classList.add('editing');
            
            // 표시 모드와 편집 모드 전환
            document.getElementById(`display-${id}`).classList.add('hidden');
            document.getElementById(`edit-${id}`).classList.remove('hidden');
        }

        // 수정 저장
        async function saveEdit(id) {
            try {
                const newName = document.getElementById(`edit-name-${id}`).value.trim();
                const newGroup = document.getElementById(`edit-group-${id}`).value;
                const newDesc = document.getElementById(`edit-desc-${id}`).value.trim();
                
                if (!newName) {
                    showMessage('활동종목명은 필수입니다.', false);
                    return;
                }

                const updateData = {
                    category_name: newName,
                    category_group: newGroup,
                    description: newDesc
                };

                console.log('수정 요청 데이터:', updateData);

                const response = await fetch(`/api/categories/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updateData)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || '수정에 실패했습니다.');
                }

                const result = await response.json();
                
                if (result.success) {
                    showMessage('활동종목이 성공적으로 수정되었습니다.');
                    
                    // 로컬 데이터 업데이트
                    const categoryIndex = categories.findIndex(c => c.id === id);
                    if (categoryIndex !== -1) {
                        categories[categoryIndex] = {
                            ...categories[categoryIndex],
                            category_name: newName,
                            category_group: newGroup,
                            description: newDesc
                        };
                    }
                    
                    // 편집 모드 종료
                    cancelEdit(id);
                    
                    // 카드 내용 업데이트
                    updateCardContent(id, newName, newGroup, newDesc);
                    
                    hasChanges = true;
                } else {
                    showMessage(result.error || '수정에 실패했습니다.', false);
                }
                
            } catch (error) {
                console.error('수정 오류:', error);
                showMessage('수정 중 오류가 발생했습니다.', false);
            }
        }

        // 카드 내용 업데이트
        function updateCardContent(id, name, group, description) {
            document.getElementById(`name-${id}`).textContent = name;
            document.getElementById(`desc-${id}`).textContent = description || '설명 없음';
            
            // 표시 모드의 데이터도 업데이트
            const displayMode = document.getElementById(`display-${id}`);
            const dataRows = displayMode.querySelectorAll('.data-row');
            dataRows[0].querySelector('.data-value').textContent = name;
            dataRows[1].querySelector('.data-value').textContent = group;
            dataRows[2].querySelector('.data-value').textContent = description || '설명 없음';
        }

        // 수정 취소
        function cancelEdit(id) {
            editingId = null;
            const card = document.getElementById(`card-${id}`);
            
            // 카드를 일반 모드로 변경
            card.classList.remove('editing');
            
            // 표시 모드와 편집 모드 전환
            document.getElementById(`display-${id}`).classList.remove('hidden');
            document.getElementById(`edit-${id}`).classList.add('hidden');
        }

        // 활동자료 추가
        function addActivityRecord(categoryId) {
            const target = prompt('대상을 입력하세요:');
            if (!target) return;
            
            const count = parseInt(prompt('횟수를 입력하세요 (숫자):')) || 0;
            const catechism_guide = parseInt(prompt('교리반인도를 입력하세요 (숫자):')) || 0;
            const group_join = parseInt(prompt('단체가입을 입력하세요 (숫자):')) || 0;
            const meeting_head = parseInt(prompt('회두를 입력하세요 (숫자):')) || 0;
            
            const recordData = {
                category_id: categoryId,
                target: target,
                count: count,
                catechism_guide: catechism_guide,
                group_join: group_join,
                meeting_head: meeting_head,
                activity_date: new Date().toISOString().split('T')[0]
            };
            
            saveActivityRecord(recordData);
        }

        // 활동자료 저장
        async function saveActivityRecord(recordData) {
            try {
                const response = await fetch('/api/activity-records', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(recordData)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || '활동자료 추가에 실패했습니다.');
                }

                const result = await response.json();
                
                if (result.success) {
                    showMessage('활동자료가 성공적으로 추가되었습니다.');
                    
                    // 로컬 데이터 업데이트
                    if (!activityRecords[recordData.category_id]) {
                        activityRecords[recordData.category_id] = [];
                    }
                    activityRecords[recordData.category_id].unshift(result.record);
                    
                    // 화면 업데이트
                    updateRecordsList(recordData.category_id);
                    
                    hasChanges = true;
                } else {
                    showMessage(result.error || '활동자료 추가에 실패했습니다.', false);
                }
                
            } catch (error) {
                console.error('활동자료 추가 오류:', error);
                showMessage('활동자료 추가 중 오류가 발생했습니다.', false);
            }
        }

        // 활동자료 목록 업데이트
        function updateRecordsList(categoryId) {
            const recordsList = document.getElementById(`records-list-${categoryId}`);
            const records = activityRecords[categoryId] || [];
            
            if (records.length > 0) {
                recordsList.innerHTML = records.map(record => `
                    <div class="record-item" onclick="viewRecord(${categoryId}, ${record.id})">
                        <div class="record-target">${record.target || '대상 없음'}</div>
                        <div class="record-date">${new Date(record.activity_date).toLocaleDateString()}</div>
                        <div class="record-summary">
                            횟수: ${record.count}, 교리반인도: ${record.catechism_guide}, 
                            단체가입: ${record.group_join}, 회두: ${record.meeting_head}
                        </div>
                    </div>
                `).join('');
            } else {
                recordsList.innerHTML = '<div class="no-records">활동자료가 없습니다</div>';
            }
            
            // 개수 업데이트
            const countElement = recordsList.parentElement.querySelector('.records-count');
            if (countElement) {
                countElement.textContent = `${records.length}개`;
            }
        }

        // 활동자료 상세 보기
        function viewRecord(categoryId, recordId) {
            const records = activityRecords[categoryId] || [];
            const record = records.find(r => r.id === recordId);
            
            if (!record) {
                showMessage('활동자료를 찾을 수 없습니다.', false);
                return;
            }
            
            const details = `
활동자료 상세 정보:
- 대상: ${record.target || '없음'}
- 횟수: ${record.count}
- 교리반인도: ${record.catechism_guide}
- 단체가입: ${record.group_join}
- 회두: ${record.meeting_head}
- 해소: ${record.resolution}
- 성사: ${record.sacrament}
- 견진: ${record.confirmation}
- 세례: ${record.baptism}
- 첫영성체: ${record.first_communion}
- 연도: ${record.year_count}
- 장례미사: ${record.funeral_mass}
- 장지참석: ${record.funeral_attendance}
- 대세: ${record.conditional_baptism}
- 보례: ${record.conditional_communion}
- 입단: ${record.membership}
- 설립: ${record.establishment}
- 메모: ${record.note || '없음'}
- 활동일자: ${new Date(record.activity_date).toLocaleDateString()}
            `;
            
            alert(details);
        }

        // 새 활동종목 추가
        document.getElementById('addForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const categoryName = document.getElementById('newCategoryName').value.trim();
            const categoryGroup = document.getElementById('newCategoryGroup').value;
            const description = document.getElementById('newDescription').value.trim();
            
            if (!categoryName || !categoryGroup) {
                showMessage('활동종목명과 활동그룹은 필수입니다.', false);
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '추가 중...';

            try {
                const addData = {
                    category_name: categoryName,
                    category_group: categoryGroup,
                    description: description
                };

                console.log('추가 요청 데이터:', addData);

                const response = await fetch('/api/categories', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(addData)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || '추가에 실패했습니다.');
                }

                const result = await response.json();
                
                if (result.success) {
                    showMessage('새 활동종목이 성공적으로 추가되었습니다.');
                    
                    // 폼 초기화
                    document.getElementById('addForm').reset();
                    
                    // 데이터 다시 로드
                    await loadCategories();
                } else {
                    showMessage(result.error || '추가에 실패했습니다.', false);
                }
                
            } catch (error) {
                console.error('추가 오류:', error);
                showMessage('추가 중 오류가 발생했습니다.', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        // 모든 변경사항 저장
        async function saveAllChanges() {
            if (!hasChanges) {
                showMessage('저장할 변경사항이 없습니다.');
                return;
            }

            if (confirm('모든 변경사항을 저장하시겠습니까?')) {
                showMessage('모든 변경사항이 저장되었습니다.');
                hasChanges = false;
            }
        }

        // 메시지 표시 함수
        function showMessage(message, isSuccess = true) {
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            if (isSuccess) {
                successMsg.textContent = message;
                successMsg.style.display = 'block';
                errorMsg.style.display = 'none';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 5000);
            } else {
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 5000);
            }
        }

        // 뒤로가기
        function goBack() {
            if (hasChanges) {
                if (confirm('저장하지 않은 변경사항이 있습니다. 정말로 나가시겠습니까?')) {
                    window.history.back();
                }
            } else {
                window.history.back();
            }
        }
    </script>
</body>
