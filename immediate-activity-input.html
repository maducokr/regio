<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>즉시 활동 입력 시스템</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .form-container {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        
        .activity-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .field-input {
            position: relative;
        }
        
        .field-input input {
            padding-right: 50px;
        }
        
        .save-indicator {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .save-indicator.saving {
            opacity: 1;
            color: #ff9800;
        }
        
        .save-indicator.saved {
            opacity: 1;
            color: #4CAF50;
        }
        
        .save-indicator.error {
            opacity: 1;
            color: #f44336;
        }
        
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .status-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .realtime-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            z-index: 1000;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.3s ease;
        }
        
        .realtime-status.show {
            opacity: 1;
            transform: translateX(0);
        }
        
        .realtime-status.saving {
            background: #ff9800;
        }
        
        .realtime-status.saved {
            background: #4CAF50;
        }
        
        .realtime-status.error {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ 즉시 활동 입력</h1>
            <p>입력과 동시에 실시간으로 데이터베이스에 저장됩니다</p>
        </div>
        
        <div class="form-container">
            <form id="activityForm">
                <div class="form-group">
                    <label for="memberSelect">회원 선택</label>
                    <select id="memberSelect" required>
                        <option value="">회원을 선택하세요</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="categorySelect">활동 종목</label>
                    <select id="categorySelect" required>
                        <option value="">활동 종목을 선택하세요</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="activityDate">활동 날짜</label>
                    <input type="date" id="activityDate" required>
                </div>
                
                <div class="activity-fields" id="activityFields">
                    <!-- 동적으로 생성되는 필드들 -->
                </div>
                
                <div class="form-group">
                    <label for="note">비고</label>
                    <input type="text" id="note" placeholder="추가 메모 (선택사항)">
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    💾 전체 저장
                </button>
            </form>
            
            <div class="status-message" id="statusMessage"></div>
        </div>
    </div>
    
    <div class="realtime-status" id="realtimeStatus"></div>

    <script>
        let members = [];
        let categories = [];
        let fieldMappings = [];
        let saveTimeouts = {};
        
        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', async () => {
            // 오늘 날짜 설정
            document.getElementById('activityDate').value = new Date().toISOString().split('T')[0];
            
            // 데이터 로드
            await loadMembers();
            await loadCategories();
            await loadFieldMappings();
            
            // 이벤트 리스너 설정
            setupEventListeners();
        });
        
        // 이벤트 리스너 설정
        function setupEventListeners() {
            document.getElementById('categorySelect').addEventListener('change', loadActivityFields);
            document.getElementById('activityForm').addEventListener('submit', handleFormSubmit);
        }
        
        // 회원 목록 로드
        async function loadMembers() {
            try {
                const response = await fetch('/api/members');
                members = await response.json();
                
                const select = document.getElementById('memberSelect');
                select.innerHTML = '<option value="">회원을 선택하세요</option>';
                
                members.forEach(member => {
                    const option = document.createElement('option');
                    option.value = member.id;
                    option.textContent = `${member.name} (${member.church_name})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('회원 로드 오류:', error);
                showStatus('회원 목록을 불러오는데 실패했습니다.', 'error');
            }
        }
        
        // 카테고리 목록 로드
        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                categories = await response.json();
                
                const select = document.getElementById('categorySelect');
                select.innerHTML = '<option value="">활동 종목을 선택하세요</option>';
                
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.category_name;
                    option.textContent = category.category_name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('카테고리 로드 오류:', error);
                showStatus('활동 종목을 불러오는데 실패했습니다.', 'error');
            }
        }
        
        // 필드 매핑 로드
        async function loadFieldMappings() {
            try {
                const response = await fetch('/api/activity-field-mapping');
                const result = await response.json();
                fieldMappings = result.mappings || [];
            } catch (error) {
                console.error('필드 매핑 로드 오류:', error);
            }
        }
        
        // 활동 필드 로드
        function loadActivityFields() {
            const categoryName = document.getElementById('categorySelect').value;
            const fieldsContainer = document.getElementById('activityFields');
            
            fieldsContainer.innerHTML = '';
            
            if (!categoryName) return;
            
            // 해당 카테고리의 필드들 찾기
            const categoryFields = fieldMappings.filter(mapping => 
                mapping.category_name === categoryName
            );
            
            if (categoryFields.length === 0) {
                // 기본 필드들 표시
                const defaultFields = [
                    { field_name: 'count', field_display_name: '횟수', field_type: 'integer' },
                    { field_name: 'target', field_display_name: '대상', field_type: 'integer' }
                ];
                
                defaultFields.forEach(field => {
                    createFieldInput(field, categoryName);
                });
            } else {
                categoryFields.forEach(field => {
                    createFieldInput(field, categoryName);
                });
            }
        }
        
        // 필드 입력 생성
        function createFieldInput(field, categoryName) {
            const fieldsContainer = document.getElementById('activityFields');
            
            const fieldDiv = document.createElement('div');
            fieldDiv.className = 'field-input';
            
            fieldDiv.innerHTML = `
                <label for="${field.field_name}">${field.field_display_name}</label>
                <input 
                    type="number" 
                    id="${field.field_name}" 
                    name="${field.field_name}"
                    placeholder="0"
                    min="0"
                    step="${field.field_type === 'decimal' ? '0.1' : '1'}"
                    data-category="${categoryName}"
                    data-field="${field.field_name}"
                >
                <div class="save-indicator" id="indicator_${field.field_name}">💾</div>
            `;
            
            fieldsContainer.appendChild(fieldDiv);
            
            // 실시간 저장 이벤트 리스너 추가
            const input = fieldDiv.querySelector('input');
            input.addEventListener('input', debounce(() => {
                saveFieldRealtime(input);
            }, 1000));
        }
        
        // 실시간 필드 저장
        async function saveFieldRealtime(input) {
            const memberId = document.getElementById('memberSelect').value;
            const activityDate = document.getElementById('activityDate').value;
            const categoryName = input.dataset.category;
            const fieldName = input.dataset.field;
            const fieldValue = parseInt(input.value) || 0;
            
            if (!memberId || !activityDate) {
                return;
            }
            
            const indicator = document.getElementById(`indicator_${fieldName}`);
            const realtimeStatus = document.getElementById('realtimeStatus');
            
            // 저장 중 표시
            indicator.className = 'save-indicator saving';
            indicator.textContent = '⏳';
            realtimeStatus.className = 'realtime-status show saving';
            realtimeStatus.textContent = '저장 중...';
            
            try {
                const response = await fetch('/api/activities/realtime', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        member_id: parseInt(memberId),
                        category_name: categoryName,
                        field_name: fieldName,
                        field_value: fieldValue,
                        activity_date: activityDate
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 저장 성공 표시
                    indicator.className = 'save-indicator saved';
                    indicator.textContent = '✅';
                    realtimeStatus.className = 'realtime-status show saved';
                    realtimeStatus.textContent = '저장 완료';
                    
                    // 2초 후 표시 제거
                    setTimeout(() => {
                        indicator.className = 'save-indicator';
                        realtimeStatus.className = 'realtime-status';
                    }, 2000);
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error('실시간 저장 오류:', error);
                
                // 저장 실패 표시
                indicator.className = 'save-indicator error';
                indicator.textContent = '❌';
                realtimeStatus.className = 'realtime-status show error';
                realtimeStatus.textContent = '저장 실패';
                
                // 3초 후 표시 제거
                setTimeout(() => {
                    indicator.className = 'save-indicator';
                    realtimeStatus.className = 'realtime-status';
                }, 3000);
            }
        }
        
        // 폼 제출 처리
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '💾 저장 중...';
            
            try {
                const memberId = document.getElementById('memberSelect').value;
                const categoryName = document.getElementById('categorySelect').value;
                const activityDate = document.getElementById('activityDate').value;
                const note = document.getElementById('note').value;
                
                if (!memberId || !categoryName || !activityDate) {
                    throw new Error('필수 정보를 모두 입력해주세요.');
                }
                
                // 모든 필드 값 수집
                const fieldInputs = document.querySelectorAll('#activityFields input[type="number"]');
                const fieldData = {};
                
                for (let input of fieldInputs) {
                    const fieldName = input.name;
                    const fieldValue = parseInt(input.value) || 0;
                    fieldData[fieldName] = fieldValue;
                }
                
                // 전체 저장
                const response = await fetch('/api/activity-records', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        member_id: parseInt(memberId),
                        category_name: categoryName,
                        activity_date: activityDate,
                        field_data: fieldData,
                        note: note
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus('활동이 성공적으로 저장되었습니다!', 'success');
                    resetForm();
                } else {
                    throw new Error(result.error || '저장에 실패했습니다.');
                }
                
            } catch (error) {
                console.error('저장 오류:', error);
                showStatus(error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '💾 전체 저장';
            }
        }
        
        // 폼 초기화
        function resetForm() {
            document.getElementById('activityForm').reset();
            document.getElementById('activityDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('activityFields').innerHTML = '';
        }
        
        // 상태 메시지 표시
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type} show`;
            
            setTimeout(() => {
                statusDiv.className = 'status-message';
            }, 5000);
        }
        
        // 디바운스 함수
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
