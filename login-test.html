<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>로그인 테스트</h1>
        
        <div class="form-group">
            <label for="username">성명:</label>
            <input type="text" id="username" placeholder="성명을 입력하세요">
        </div>
        
        <div class="form-group">
            <label for="password">비밀번호:</label>
            <input type="password" id="password" placeholder="전화번호 끝 4자리 + 주민번호 앞 6자리">
        </div>
        
        <button onclick="testLogin()">로그인 테스트</button>
        
        <div id="result"></div>
        
        <h3>테스트 계정 정보:</h3>
        <ul>
            <li><strong>김학숭</strong>: 1240520301</li>
            <li><strong>최미숙</strong>: 1240600313</li>
        </ul>
    </div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!username || !password) {
                resultDiv.innerHTML = '<div class="error">성명과 비밀번호를 모두 입력해주세요.</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="info">로그인 시도 중...</div>';
            
            try {
                console.log('로그인 요청:', { username, password });
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: username,
                        password: password
                    })
                });
                
                console.log('응답 상태:', response.status);
                console.log('응답 헤더:', response.headers);
                
                const responseText = await response.text();
                console.log('응답 텍스트:', responseText);
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        if (data.success) {
                            resultDiv.innerHTML = `
                                <div class="success">
                                    <h4>✅ 로그인 성공!</h4>
                                    <p>사용자: ${data.user.name}</p>
                                    <p>성당: ${data.user.church_name}</p>
                                    <p>PR: ${data.user.pr_name}</p>
                                    <p>직책: ${data.user.position}</p>
                                </div>
                            `;
                        } else {
                            resultDiv.innerHTML = `<div class="error">❌ 로그인 실패: ${data.error || '알 수 없는 오류'}</div>`;
                        }
                    } catch (e) {
                        resultDiv.innerHTML = `<div class="error">❌ 응답 파싱 오류: ${e.message}</div>`;
                    }
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>❌ HTTP 오류: ${response.status}</h4>
                            <p>응답: ${responseText}</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('로그인 오류:', error);
                resultDiv.innerHTML = `<div class="error">❌ 네트워크 오류: ${error.message}</div>`;
            }
        }
        
        // Enter 키로 로그인
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testLogin();
            }
        });
    </script>
</body>
</html>
