# Render: Web Service만 정의. PostgreSQL은 Dashboard에서 생성 후
# Environment → DATABASE_URL = Internal Database URL 로 연결하세요.
# (DB_HOST=localhost 는 Render에서 ECONNREFUSED 원인이므로 두지 마세요.)

services:
  - type: web
    name: regio-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
