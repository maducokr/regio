services:
  - type: web
    name: regio-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: regio
      - key: DB_PORT
        value: 5432
      # 모의 시드는 로컬에서 ALLOW_SAMPLE_SEED=1 로만 실행 (서버 env에 상시 두지 말 것)
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
