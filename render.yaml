# 이 파일은 Blueprint용 참고입니다.
# 현재 Web Service 이름(regio)은 Dashboard에서 관리 중이면,
# Environment의 DATABASE_URL 은 Dashboard에서만 저장해야 런타임에 주입됩니다.
#
# ※ sync: false 로 DATABASE_URL 을 여기에 두면 Blueprint 초기 생성 시에만
#   값을 묻고, 이후 Dashboard에 보이는 값과 런타임이 어긋날 수 있습니다.
#   → DATABASE_URL 은 render.yaml 에 넣지 말고 Dashboard에만 두세요.

services:
  - type: web
    name: regio
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
